<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainTrackr Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(45deg, #1e3a8a, #10b981, #3b82f6, #22c55e);
    color: #fff;
    min-height: 100vh;
    background-size: 300% 300%;
    animation: gradientBG 8s ease infinite;
}
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.dashboard-container {
    max-width: 600px;
    margin: 50px auto;
    background: #fff;
    color: #1e293b;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

h1 { text-align: center; font-family: 'Poppins', sans-serif; font-weight: 700; color: #1e3a8a; }

.train-card {
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    background: #f1f5f9;
}

.train-card h3 { margin: 0; color: #1e3a8a; }
.train-card p { margin: 5px 0; }

.crowd-low { color: green; font-weight: bold; }
.crowd-medium { color: orange; font-weight: bold; }
.crowd-high { color: red; font-weight: bold; }

.no-trains {
    text-align: center;
    font-weight: bold;
    color: #111827;
    padding: 30px 0;
}
</style>
</head>
<body>
<div class="dashboard-container">
    <h1>Your Train Details</h1>
    <div id="trains-list"></div>
</div>

<script>
(async function() {
    const container = document.getElementById('trains-list');
    const userInfo = JSON.parse(localStorage.getItem('userDetails') || '{}'); // <-- match onboarding

    if (!userInfo || !userInfo.source_station) {
        container.innerHTML = '<div class="no-trains">No user info found. Please fill onboarding form first.</div>';
        return;
    }

    try {
        // Since backend may not exist, show demo info based on localStorage
        const trainsDemo = [
            {
                name: "Sealdah- Naihati Local",
                train_no: "31439",
                expected_arrival: "08:05 am",
                expected_departure: "08:10 am",
                delay: 1,
                crowd_level: Math.floor(Math.random() * 100) // random for demo
            },
            {
                name: "Sealdah - Ranaghat Local",
                train_no: "31617",
                expected_arrival:"08:20 am",
                expected_departure: "08:21",
                delay: 0,
                crowd_level: Math.floor(Math.random() * 100)
            }
        ];

        container.innerHTML = '';
        trainsDemo.forEach(train => {
            // Determine crowd class
            let crowdClass = 'low';
            if (train.crowd_level >= 50 && train.crowd_level < 80) crowdClass = 'medium';
            else if (train.crowd_level >= 80) crowdClass = 'high';

            const div = document.createElement('div');
            div.className = "train-card";
            div.innerHTML = `
                <h3>${train.name} (${train.train_no})</h3>
                <p>ETA: ${train.expected_arrival} | ETD: ${train.expected_departure} | Delay: ${train.delay} min</p>
                <p>Crowd Level: <span class="crowd-${crowdClass}">${train.crowd_level}%</span></p>
            `;
            container.appendChild(div);
        });

    } catch (err) {
        container.innerHTML = `<div class="no-trains">Error fetching trains: ${err.message}</div>`;
    }
})();
</script>
</body>
</html>
