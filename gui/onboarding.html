<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainTrackr Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    color: #fff;
    background: linear-gradient(45deg, #1e3a8a, #10b981, #3b82f6, #22c55e);
    background-size: 300% 300%;
    animation: gradientBG 8s ease infinite;
}
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.onboarding-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
.onboarding-card {
    background: #fff;
    color: #1e293b;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    padding: 40px 30px;
    width: 100%;
    max-width: 500px;
}
.onboarding-title {
    font-family: 'Poppins', sans-serif;
    font-size: 2.8em;
    font-weight: 700;
    color: #1e3a8a;
    text-align: center;
    margin-bottom: 15px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}
.onboarding-subtitle {
    text-align: center;
    font-size: 1.1em;
    color: #334155;
    margin-bottom: 30px;
}
form .input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
    position: relative;
}
form .input-group label {
    margin-bottom: 5px;
    font-weight: 500;
    color: #1e293b;
}
form .input-group input, 
form .input-group select {
    padding: 12px 15px;
    border-radius: 8px;
    border: none;
    background: #f1f5f9;
    font-size: 1em;
    outline: none;
    transition: 0.3s;
}
form .input-group input:focus,
form .input-group select:focus {
    box-shadow: 0 0 0 2px #1e3a8a;
    background: #fff;
}
.submit-button {
    width: 100%;
    padding: 14px;
    background-color: #1e3a8a;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}
.submit-button:hover {
    background-color: #3b5fc0;
}
.note-text {
    margin-top: 15px;
    font-size: 0.9em;
    color: #64748b;
    text-align: center;
}
/* Suggestions box */
.suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    z-index: 10;
    max-height: 150px;
    overflow-y: auto;
    display: none;
}
.suggestion-item {
    padding: 10px 12px;
    cursor: pointer;
    color: #1e293b;
}
.suggestion-item:hover {
    background-color: #f0f0f0;
}
</style>
</head>
<body>
<div class="onboarding-container">
    <div class="onboarding-card">
        <h1 class="onboarding-title">Welcome to TrainTrackr</h1>
        <p class="onboarding-subtitle">Fill in your passenger details to see train schedules and crowd info.</p>
        
        <form id="onboarding-form">
            <div class="input-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" required placeholder="John Doe">
            </div>
            <div class="input-group">
                <label for="pincode">Pincode</label>
                <input type="text" id="pincode" required placeholder="700001">
            </div>
            <div class="input-group">
                <label for="passenger_type">Passenger Type</label>
                <select id="passenger_type" required>
                    <option value="">Select type</option>
                    <option value="daily">Daily</option>
                    <option value="occasional">Occasional</option>
                </select>
            </div>
            <div class="input-group">
                <label for="ticket_type">Ticket Type</label>
                <select id="ticket_type" required>
                    <option value="">Select type</option>
                    <option value="single">Single</option>
                    <option value="monthly">Monthly</option>
                </select>
            </div>
            <div class="input-group">
                <label for="journey_time">Journey Time</label>
                <input type="time" id="journey_time" required>
            </div>
            <div class="input-group">
                <label for="from_station">From</label>
                <input type="text" id="from_station" required placeholder="Kolkata" autocomplete="off">
                <div class="suggestions" id="from_suggestions"></div>
            </div>
            <div class="input-group">
                <label for="destination_station">To</label>
                <input type="text" id="destination_station" required placeholder="Sealdah" autocomplete="off">
                <div class="suggestions" id="to_suggestions"></div>
            </div>
            <button type="submit" class="submit-button">Submit</button>
        </form>
        <p class="note-text">You can update these details anytime from your profile.</p>
    </div>
</div>

<script>
const form = document.getElementById('onboarding-form');

form.addEventListener('submit', (e) => {
    e.preventDefault();

    // Collect form values
    const userDetails = {
        username: document.getElementById('username').value,
        pincode: document.getElementById('pincode').value,
        passenger_type: document.getElementById('passenger_type').value,
        ticket_type: document.getElementById('ticket_type').value,
        journey_time: document.getElementById('journey_time').value,
        source_station: document.getElementById('from_station').value,
        destination_station: document.getElementById('destination_station').value
    };

    // Save to localStorage (demo mode, no backend)
    localStorage.setItem('userDetails', JSON.stringify(userDetails));

    // Redirect silently to dashboard
    window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
